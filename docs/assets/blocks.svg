<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 176" width="900" height="176" role="img" aria-label="Noteworthy Editor Blocks and Themes">
  <style>
  text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif; }
  .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace; }
  .fg { fill: #EBEBEB; }
  .mut { fill: #9E9E9E; }
  .acc { fill: #D4A373; }
  .bd { fill: none; stroke: #363636; stroke-width: 1.2; }
  .icon { fill: none; stroke: #D4A373; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .bar-bg { fill: none; stroke: #363636; stroke-width: 2; stroke-linecap: round; }
  .bar-fg { fill: none; stroke: #D4A373; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 168; stroke-dashoffset: 168; }

  .nw-c1 { animation: nw-card 8s ease-in-out infinite 0s; }
  .nw-c2 { animation: nw-card 8s ease-in-out infinite 2s; }
  .nw-c3 { animation: nw-card 8s ease-in-out infinite 4s; }
  .nw-c4 { animation: nw-card 8s ease-in-out infinite 6s; }
  @keyframes nw-card {
    0%, 20% { stroke: #D4A373; stroke-width: 1.6; }
    26%, 100% { stroke: #363636; stroke-width: 1.2; }
  }

  .nw-i1 { stroke-dasharray: 48; animation: nw-draw 8s ease-in-out infinite 0s; }
  .nw-i2 { stroke-dasharray: 140; animation: nw-draw2 8s ease-in-out infinite 2s; }
  .nw-i3 { stroke-dasharray: 30; animation: nw-draw3 8s ease-in-out infinite 4s; }
  .nw-i4 { stroke-dasharray: 80; animation: nw-draw4 8s ease-in-out infinite 6s; }
  @keyframes nw-draw  { 0% { stroke-dashoffset: 48; } 12%, 100% { stroke-dashoffset: 0; } }
  @keyframes nw-draw2 { 0% { stroke-dashoffset: 140; } 12%, 100% { stroke-dashoffset: 0; } }
  @keyframes nw-draw3 { 0% { stroke-dashoffset: 30; } 12%, 100% { stroke-dashoffset: 0; } }
  @keyframes nw-draw4 { 0% { stroke-dashoffset: 80; } 12%, 100% { stroke-dashoffset: 0; } }

  .nw-b1 { animation: nw-bar 8s ease-in-out infinite 0s; }
  .nw-b2 { animation: nw-bar 8s ease-in-out infinite 2s; }
  .nw-b3 { animation: nw-bar 8s ease-in-out infinite 4s; }
  .nw-b4 { animation: nw-bar 8s ease-in-out infinite 6s; }
  @keyframes nw-bar {
    0% { stroke-dashoffset: 168; opacity: 0.4; }
    18% { stroke-dashoffset: 0; opacity: 1; }
    25%, 100% { stroke-dashoffset: 168; opacity: 0.25; }
  }

  @media (prefers-color-scheme: light) {
    .fg { fill: #3B3834; }
    .mut { fill: #7A756E; }
    .acc { fill: #965A2B; }
    .bd { stroke: #DEDAD3; }
    .icon { stroke: #965A2B; }
    .bar-bg { stroke: #DEDAD3; }
    .bar-fg { stroke: #965A2B; }
    @keyframes nw-card {
      0%, 20% { stroke: #965A2B; stroke-width: 1.6; }
      26%, 100% { stroke: #DEDAD3; stroke-width: 1.2; }
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .nw-c1, .nw-c2, .nw-c3, .nw-c4,
    .nw-i1, .nw-i2, .nw-i3, .nw-i4,
    .nw-b1, .nw-b2, .nw-b3, .nw-b4 { animation: none !important; stroke-dashoffset: 0 !important; }
    .bar-fg { opacity: 0.5 !important; }
  }
  </style>

  <!-- Card 1 -->
  <rect x="10" y="12" width="208" height="152" rx="8" class="bd nw-c1"/>
  <path d="M36 42l-7 7 7 7M48 42l7 7-7 7" class="icon nw-i1"/>
  <text x="30" y="88" font-size="16" font-weight="600" class="fg">CodeBlock</text>
  <text x="30" y="112" font-size="12.5" class="mut">Language tag, line numbers</text>
  <text x="30" y="132" font-size="12.5" class="mut">and one-click copy.</text>
  <line x1="30" y1="150" x2="198" y2="150" class="bar-bg"/>
  <line x1="30" y1="150" x2="198" y2="150" class="bar-fg nw-b1"/>

  <!-- Card 2 -->
  <rect x="234" y="12" width="208" height="152" rx="8" class="bd nw-c2"/>
  <g class="nw-i2">
    <rect x="254" y="38" width="22" height="18" rx="3" class="icon"/>
    <line x1="254" y1="47" x2="276" y2="47" class="icon"/>
    <line x1="265" y1="38" x2="265" y2="56" class="icon"/>
  </g>
  <text x="254" y="88" font-size="16" font-weight="600" class="fg">TableBlock</text>
  <text x="254" y="112" font-size="12.5" class="mut">Spreadsheet-style editing</text>
  <text x="254" y="132" font-size="12.5" class="mut">saved as Markdown tables.</text>
  <line x1="254" y1="150" x2="422" y2="150" class="bar-bg"/>
  <line x1="254" y1="150" x2="422" y2="150" class="bar-fg nw-b2"/>

  <!-- Card 3 -->
  <rect x="458" y="12" width="208" height="152" rx="8" class="bd nw-c3"/>
  <line x1="482" y1="56" x2="492" y2="36" class="icon nw-i3"/>
  <text x="478" y="88" font-size="16" font-weight="600" class="fg">Slash Commands</text>
  <text x="478" y="112" font-size="12.5" class="mut">Type / for headings, lists,</text>
  <text x="478" y="132" font-size="12.5" class="mut">callouts and gutter controls.</text>
  <line x1="478" y1="150" x2="646" y2="150" class="bar-bg"/>
  <line x1="478" y1="150" x2="646" y2="150" class="bar-fg nw-b3"/>

  <!-- Card 4 -->
  <rect x="682" y="12" width="208" height="152" rx="8" class="bd nw-c4"/>
  <g class="nw-i4">
    <circle cx="712" cy="47" r="9" class="icon"/>
    <circle cx="712" cy="47" r="3" class="icon"/>
  </g>
  <text x="702" y="88" font-size="16" font-weight="600" class="fg">16 Themes, 31 Fonts</text>
  <text x="702" y="112" font-size="12.5" class="mut">Light Graphite default,</text>
  <text x="702" y="132" font-size="12.5" class="mut">Sepia, Nord, Midnight.</text>
  <line x1="702" y1="150" x2="870" y2="150" class="bar-bg"/>
  <line x1="702" y1="150" x2="870" y2="150" class="bar-fg nw-b4"/>
</svg>

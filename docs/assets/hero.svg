<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 205" width="900" height="205" role="img" aria-label="Noteworthy — local-first Markdown notes for macOS">
  <style>
  text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif; }
  .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace; }
  .fg { fill: #EBEBEB; }
  .mut { fill: #9E9E9E; }
  .acc { fill: #D4A373; }
  .bd { fill: none; stroke: #363636; stroke-width: 1.2; }
  .bd-acc { fill: none; stroke: #D4A373; stroke-width: 1.2; }
  .dot { fill: #D4A373; }
  .ring { fill: none; stroke: #D4A373; stroke-width: 1.2; }

  .nw-caret { fill: #D4A373; animation: nw-blink 1.1s step-end infinite; }
  @keyframes nw-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  .nw-pulse { transform-origin: 368px 26px; animation: nw-ring 2.4s ease-out infinite; }
  @keyframes nw-ring { 0% { opacity: 0.9; transform: scale(1); } 80%, 100% { opacity: 0; transform: scale(2.4); } }

  .nw-tag { opacity: 0; }
  .nw-t1 { animation: nw-cycle 9s ease-in-out infinite 0s; }
  .nw-t2 { animation: nw-cycle 9s ease-in-out infinite 3s; }
  .nw-t3 { animation: nw-cycle 9s ease-in-out infinite 6s; }
  @keyframes nw-cycle {
    0%, 28% { opacity: 1; }
    33%, 95% { opacity: 0; }
    100% { opacity: 1; }
  }

  .nw-p1 { animation: nw-pill 7.5s ease-in-out infinite 0s; }
  .nw-p2 { animation: nw-pill 7.5s ease-in-out infinite 1.5s; }
  .nw-p3 { animation: nw-pill 7.5s ease-in-out infinite 3.0s; }
  .nw-p4 { animation: nw-pill 7.5s ease-in-out infinite 4.5s; }
  .nw-p5 { animation: nw-pill 7.5s ease-in-out infinite 6.0s; }
  @keyframes nw-pill {
    0%, 16% { stroke: #D4A373; stroke-width: 1.6; }
    22%, 100% { stroke: #363636; stroke-width: 1.2; }
  }

  .nw-pt1 { animation: nw-ptxt 7.5s ease-in-out infinite 0s; }
  .nw-pt2 { animation: nw-ptxt 7.5s ease-in-out infinite 1.5s; }
  .nw-pt3 { animation: nw-ptxt 7.5s ease-in-out infinite 3.0s; }
  .nw-pt4 { animation: nw-ptxt 7.5s ease-in-out infinite 4.5s; }
  .nw-pt5 { animation: nw-ptxt 7.5s ease-in-out infinite 6.0s; }
  @keyframes nw-ptxt {
    0%, 16% { fill: #D4A373; }
    22%, 100% { fill: #EBEBEB; }
  }

  @media (prefers-color-scheme: light) {
    .fg { fill: #3B3834; }
    .mut { fill: #7A756E; }
    .acc { fill: #965A2B; }
    .bd { stroke: #DEDAD3; }
    .bd-acc { stroke: #965A2B; }
    .dot { fill: #965A2B; }
    .ring { stroke: #965A2B; }
    .nw-caret { fill: #965A2B; }
    @keyframes nw-pill {
      0%, 16% { stroke: #965A2B; stroke-width: 1.6; }
      22%, 100% { stroke: #DEDAD3; stroke-width: 1.2; }
    }
    @keyframes nw-ptxt {
      0%, 16% { fill: #965A2B; }
      22%, 100% { fill: #3B3834; }
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .nw-caret, .nw-pulse, .nw-t1, .nw-t2, .nw-t3,
    .nw-p1, .nw-p2, .nw-p3, .nw-p4, .nw-p5,
    .nw-pt1, .nw-pt2, .nw-pt3, .nw-pt4, .nw-pt5 { animation: none !important; }
    .nw-t1 { opacity: 1 !important; }
    .nw-t2, .nw-t3 { opacity: 0 !important; }
    .nw-pulse { opacity: 0 !important; }
  }
  </style>

  <circle cx="368" cy="26" r="3.5" class="dot"/>
  <circle cx="368" cy="26" r="3.5" class="ring nw-pulse"/>
  <text x="380" y="30" font-size="12.5" font-weight="600" letter-spacing="1.1" class="mono acc">LOCAL-FIRST MACOS</text>

  <text x="450" y="78" text-anchor="middle" font-size="48" font-weight="700" letter-spacing="-1.2" class="fg">Noteworthy<tspan class="nw-caret">_</tspan></text>

  <text x="450" y="112" text-anchor="middle" font-size="16.5" font-weight="400" class="mut nw-tag nw-t1">Local-first Markdown notes for macOS. Markdown underneath, blocks on top.</text>
  <text x="450" y="112" text-anchor="middle" font-size="16.5" font-weight="400" class="mut nw-tag nw-t2">Notion-style / blocks, spreadsheet tables, and code blocks with copy.</text>
  <text x="450" y="112" text-anchor="middle" font-size="16.5" font-weight="400" class="mut nw-tag nw-t3">Tauri 2 + React + SQLite FTS5. Zero cloud lock-in, instant Cmd+K search.</text>

  <g transform="translate(0, 140)">
    <rect x="135" y="0" width="110" height="30" rx="8" class="bd nw-p1"/>
    <text x="190" y="19" text-anchor="middle" font-size="13" font-weight="500" class="fg nw-pt1">Tauri 2</text>

    <rect x="260" y="0" width="130" height="30" rx="8" class="bd nw-p2"/>
    <text x="325" y="19" text-anchor="middle" font-size="13" font-weight="500" class="fg nw-pt2">React + shadcn</text>

    <rect x="405" y="0" width="135" height="30" rx="8" class="bd nw-p3"/>
    <text x="472" y="19" text-anchor="middle" font-size="13" font-weight="500" class="fg nw-pt3">SQLite + FTS5</text>

    <rect x="555" y="0" width="110" height="30" rx="8" class="bd nw-p4"/>
    <text x="610" y="19" text-anchor="middle" font-size="13" font-weight="500" class="fg nw-pt4">16 Themes</text>

    <rect x="680" y="0" width="95" height="30" rx="8" class="bd nw-p5"/>
    <text x="727" y="19" text-anchor="middle" font-size="13" font-weight="500" class="fg nw-pt5">Offline</text>
  </g>
</svg>

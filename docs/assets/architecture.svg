<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250">
  <style>
  text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif; }
  .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace; }
  .fg { fill: #EBEBEB; }
  .mut { fill: #9E9E9E; }
  .acc { fill: #D4A373; }
  .bd { fill: none; stroke: #363636; stroke-width: 1.2; }
  .bd-acc { fill: none; stroke: #D4A373; stroke-width: 1.2; }
  .dash { fill: none; stroke: #525252; stroke-width: 1.2; stroke-dasharray: 4 4; }
  .icon { fill: none; stroke: #D4A373; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .caret { fill: #D4A373; animation: blink 1.2s step-end infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  @media (prefers-color-scheme: light) {
    .fg { fill: #3B3834; }
    .mut { fill: #7A756E; }
    .acc { fill: #965A2B; }
    .bd { stroke: #DEDAD3; }
    .bd-acc { stroke: #965A2B; }
    .dash { stroke: #B8B2A8; }
    .icon { stroke: #965A2B; }
    .caret { fill: #965A2B; }
  }
  @media (prefers-reduced-motion: reduce) {
    .caret { animation: none; }
  }
</style>
  <!-- Top layer: React UI -->
  <rect x="20" y="12" width="860" height="96" rx="8" class="bd"/>
  <text x="40" y="38" font-size="16" font-weight="600" class="fg">React + TypeScript + Tailwind</text>
  <text x="860" y="38" text-anchor="end" font-size="12.5" class="mono mut">src/</text>

  <rect x="40" y="54" width="185" height="38" rx="6" class="bd"/>
  <text x="132" y="77" text-anchor="middle" font-size="13" class="fg">Sidebar &amp; Tabs</text>

  <rect x="245" y="54" width="205" height="38" rx="6" class="bd-acc"/>
  <text x="347" y="77" text-anchor="middle" font-size="13" class="acc">Block Editor (/ + MD)</text>

  <rect x="470" y="54" width="185" height="38" rx="6" class="bd"/>
  <text x="562" y="77" text-anchor="middle" font-size="13" class="fg">Cmd+K Search</text>

  <rect x="675" y="54" width="185" height="38" rx="6" class="bd"/>
  <text x="767" y="77" text-anchor="middle" font-size="13" class="fg">lib/blocks &amp; store</text>

  <!-- Connector -->
  <line x1="250" y1="108" x2="250" y2="144" class="dash"/>
  <line x1="650" y1="108" x2="650" y2="144" class="dash"/>
  <text x="450" y="131" text-anchor="middle" font-size="12.5" class="mono mut">Tauri IPC &amp; Markdown serialization</text>

  <!-- Bottom layer: Rust Shell -->
  <rect x="20" y="144" width="860" height="92" rx="8" class="bd"/>
  <text x="40" y="170" font-size="16" font-weight="600" class="fg">Rust Native Shell (Tauri 2)</text>
  <text x="860" y="170" text-anchor="end" font-size="12.5" class="mono mut">src-tauri/</text>

  <rect x="40" y="184" width="255" height="36" rx="6" class="bd"/>
  <text x="167" y="206" text-anchor="middle" font-size="13" class="fg">SQLite + FTS5 Full-Text Index</text>

  <rect x="322" y="184" width="255" height="36" rx="6" class="bd"/>
  <text x="449" y="206" text-anchor="middle" font-size="13" class="fg">Local Filesystem Storage</text>

  <rect x="604" y="184" width="256" height="36" rx="6" class="bd"/>
  <text x="732" y="206" text-anchor="middle" font-size="13" class="fg">Universal macOS (.app / .dmg)</text>
</svg>
